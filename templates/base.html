<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Drafter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-layer-group"></i> StatusTool</h3>
            </div>
            
            <ul class="nav-links">
                {% if session['role'] == 'admin' %}
                <li>
                    <a href="{{ url_for('dashboard') }}" class="nav-item">
                        <i class="fas fa-home"></i> <span>Dashboard</span>
                    </a>
                </li>
                {% endif %}

                <li>
                    <a href="{{ url_for('add_status') }}" class="nav-item">
                        <i class="fas fa-plus-circle"></i> <span>Add Status</span>
                    </a>
                </li>
                
                <li>
                    <a href="{{ url_for('status_list', day='today') }}" class="nav-item">
                        <i class="fas fa-calendar-day"></i> <span>Today Status</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('status_list', day='yesterday') }}" class="nav-item">
                        <i class="fas fa-history"></i> <span>Yesterday Status</span>
                    </a>
                </li>

                <li style="margin-top: auto;">
                    <a href="{{ url_for('logout') }}" class="nav-item" style="color: #ef4444;">
                        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="user-info">
                    <span>Welcome, {{ session['username'] }}</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <div class="content-wrapper">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

</body>
</html>
